name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build:
    # Skipped until the production environment is configured (docs/deployment.md).
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Code deployment to App Service (ADR 0011); the OpenAPI document is committed, not regenerated.
      - name: Publish
        run: >
          dotnet publish src/Catalog.Api/Catalog.Api.csproj -c Release -r linux-x64 --self-contained false
          -p:OpenApiGenerateDocuments=false -o "$GITHUB_WORKSPACE/publish"

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish
          if-no-files-found: error

  migrate:
    # Migrations run before the new version goes live, and never at API start-up.
    needs: build
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version "10.0.*"

      - name: Build migrations bundle
        run: dotnet ef migrations bundle --project src/Catalog.Api --output efbundle --self-contained --target-runtime linux-x64

      - name: Apply migrations
        env:
          CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: ./efbundle --connection "$CONNECTION_STRING"

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      # The Free plan unloads idle apps, so the first request can take a while.
      - name: Wait for /api/health
        env:
          HEALTH_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health
        run: |
          for attempt in $(seq 1 20); do
            if curl --silent --fail --max-time 30 "$HEALTH_URL"; then
              echo
              echo "API is healthy."
              exit 0
            fi
            echo "Attempt $attempt: not healthy yet."
            sleep 15
          done
          echo "::error::$HEALTH_URL never answered 200."
          exit 1
