name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    # Pull requests run the flow only when the end-to-end setup itself changes.
    paths:
      - "web/e2e/**"
      - "web/playwright.config.ts"
      - "docker-compose.yml"
      - "supabase/**"
      - ".github/workflows/e2e.yml"
      - "demo/**"
      - "api/tools/**"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_PLATFORM_ADMIN_EMAIL: platform-admin@e2e.test
      E2E_PLATFORM_ADMIN_PASSWORD: e2e-platform-password
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start --exclude studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor

      - name: Read Supabase keys
        run: |
          supabase status -o env > supabase.env
          set -a
          # shellcheck disable=SC1091
          . ./supabase.env
          set +a
          {
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
          } >> .env
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Apply migrations
        working-directory: api
        env:
          ConnectionStrings__Catalog: Host=localhost;Port=54322;Database=postgres;Username=postgres;Password=postgres
        run: |
          dotnet tool install --global dotnet-ef --version "10.0.*"
          dotnet build src/Catalog.Api
          dotnet ef database update --project src/Catalog.Api --no-build

      - name: Create the Platform Admin user
        run: |
          id=$(curl -sSf http://127.0.0.1:54321/auth/v1/admin/users \
            -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$E2E_PLATFORM_ADMIN_EMAIL\",\"password\":\"$E2E_PLATFORM_ADMIN_PASSWORD\",\"email_confirm\":true}" | jq -r .id)
          echo "PLATFORM_ADMIN_USER_ID=$id" >> .env

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Install before compose: its node_modules volume leaves a root-owned web/node_modules behind.
      - name: Install Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the API, the SPA and image storage
        run: |
          docker compose up --build --detach
          for url in http://localhost:8080/api/health http://localhost:5173; do
            timeout 300 bash -c "until curl -sf $url > /dev/null; do sleep 3; done" || { docker compose logs; exit 1; }
          done

      # S3Mock does not honour COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS in this image version (its log shows the
      # default root and no bucket), so the bucket is created here. 200 = created, 409 = already there.
      - name: Create the image bucket
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X PUT http://localhost:9090/catalog-images)
          case "$status" in 200|409) ;; *) echo "Creating the image bucket answered $status."; exit 1 ;; esac

      - name: Run the end-to-end flow
        working-directory: web
        run: npm run e2e

      # The Demo seeder (ADR 0014) against the same stack: a first run loads the Demo dataset, a second run
      # must change nothing, and a few public answers prove the result.
      - name: Demo seeder
        env:
          Demo__ApiUrl: http://localhost:8080
          Demo__SupabaseUrl: http://127.0.0.1:54321
          Demo__DatabaseConnectionString: Host=localhost;Port=54322;Database=postgres;Username=postgres;Password=postgres
          Demo__PlatformAdminEmail: ${{ env.E2E_PLATFORM_ADMIN_EMAIL }}
          Demo__PlatformAdminPassword: ${{ env.E2E_PLATFORM_ADMIN_PASSWORD }}
          Demo__AdminPassword: e2e-demo-admin-password
        run: |
          set -o pipefail
          export Demo__SupabaseAnonKey="$ANON_KEY" Demo__SupabaseServiceRoleKey="$SERVICE_ROLE_KEY"
          dotnet run --project api/tools/Catalog.DemoSeeder -- seed | tee demo-first.log
          dotnet run --project api/tools/Catalog.DemoSeeder -- seed | tee demo-second.log
          grep -q "^Total changes: 0$" demo-second.log || { echo "The second Demo seeder run changed something."; exit 1; }
          total=$(curl -sSf http://localhost:8080/api/public/forja-hardware/products | jq .totalCount)
          [ "$total" = "22" ] || { echo "forja-hardware has $total Published products, expected 22."; exit 1; }
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/public/tallo-garden)
          [ "$status" = "404" ] || { echo "tallo-garden answered $status, expected 404 (deactivated)."; exit 1; }

      - name: Service logs
        if: failure()
        run: |
          docker compose logs
          find web/test-results -name error-context.md -exec cat {} \; || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
