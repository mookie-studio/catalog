name: Web CI

on:
  pull_request:
    paths:
      - 'web/**'
      - 'api/openapi/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/openapi/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check API client is up to date
        run: npm run api:generate && git diff --exit-code -- src/api/schema.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
